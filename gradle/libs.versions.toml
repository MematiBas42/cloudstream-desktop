# CloudStream Desktop - Linux Native Version Catalog
# Purged: Playwright (~90 MB), JavaFX (~48 MB), Material Icons Extended (~37 MB), multi-OS Skiko runtimes (~55 MB)

[versions]
# Core Toolchains & Languages
kotlin = "2.1.0"
kotlinGradlePlugin = "2.1.0"
jvmTarget = "1.8"
jdkToolchain = "21"
minSdk = "23"
compileSdk = "36"
targetSdk = "36"

# Core Architecture & Serialization
coroutines = "1.9.0"
kotlinxCoroutines = "1.9.0"
kotlinxCoroutinesCore = "1.9.0"
jackson = "2.18.2"
jacksonModuleKotlin = "2.18.2"
json = "20240303"
kotlinxAtomicfu = "0.32.1"
kotlinxDatetime = "0.8.0"
kotlinxCollectionsImmutable = "0.4.0"
kotlinxSerializationJson = "1.7.3"
kotlinxIOCore = "0.6.0"

# Bytecode Transformation & DEX Pipeline
asm = "9.7.1"
dexTools = "2.4.28"

# Network & Parsing
okhttp = "4.12.0"
nicehttp = "0.4.18"
jsoup = "1.22.1"
ksoup = "0.2.6"
ktor = "3.0.3"

# Desktop UI & Graphics (Linux-Native x64 only)
composePlugin = "1.7.3"
skiko = "0.8.18"
coil3 = "3.0.4"
coil = "3.0.4"

# Cryptography & Scripting
cryptography = "0.6.0"
rhino = "1.8.1"
bouncyCastle = "1.77"
conscrypt = "2.5.2"

# Logging
slf4j = "2.0.12"
logback = "1.5.0"

# Testing
junit = "5.10.2"
junit5 = "5.10.2"
junit4 = "4.13.2"
junitPlatform = "1.10.2"

# Android Compatibility & Shims
androidGradlePlugin = "9.1.1"
annotation = "1.10.0"
appcompat = "1.7.1"
coreKtx = "1.18.0"
desugar_jdk_libs_nio = "2.1.5"

# Upstream Plugins & Tools
buildkonfigGradlePlugin = "0.18.0"
dokkaGradlePlugin = "2.2.0"
spotlessPlugin = "6.25.0"
newpipeextractor = "v0.26.0"

[libraries]
# Kotlin standard & test
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }

# Coroutines
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

# Jackson & JSON
jackson-core = { module = "com.fasterxml.jackson.core:jackson-core", version.ref = "jackson" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }
json = { module = "org.json:json", version.ref = "json" }

# Bytecode Transformation & DEX Tools
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
asm-commons = { module = "org.ow2.asm:asm-commons", version.ref = "asm" }
asm-tree = { module = "org.ow2.asm:asm-tree", version.ref = "asm" }
asm-util = { module = "org.ow2.asm:asm-util", version.ref = "asm" }
dex-tools = { module = "de.femtopedia.dex2jar:dex-tools", version.ref = "dexTools" }

# Network & HTTP
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-dnsoverhttps = { module = "com.squareup.okhttp3:okhttp-dnsoverhttps", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
nicehttp = { module = "com.github.Blatzar:NiceHttp", version.ref = "nicehttp" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
ksoup = { module = "com.fleeksoft.ksoup:ksoup", version.ref = "ksoup" }
ktor-http = { module = "io.ktor:ktor-http", version.ref = "ktor" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }

# Graphics & Image Loading (Coil 3 & Multiplatform Skiko Runtimes)
skiko-awt-runtime-linux-x64 = { module = "org.jetbrains.skiko:skiko-awt-runtime-linux-x64", version.ref = "skiko" }
skiko-awt-runtime-windows-x64 = { module = "org.jetbrains.skiko:skiko-awt-runtime-windows-x64", version.ref = "skiko" }
coil = { module = "io.coil-kt.coil3:coil", version.ref = "coil3" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil3" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil3" }

# KotlinX Libraries
kotlinx-atomicfu = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "kotlinxAtomicfu" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
kotlinx-collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "kotlinxCollectionsImmutable" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
kotlinx-io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinxIOCore" }

# Cryptography & JS Evaluation
cryptography-core = { module = "dev.whyoleg.cryptography:cryptography-core", version.ref = "cryptography" }
cryptography-provider-optimal = { module = "dev.whyoleg.cryptography:cryptography-provider-optimal", version.ref = "cryptography" }
rhino = { module = "org.mozilla:rhino", version.ref = "rhino" }
bouncycastle-prov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncyCastle" }
conscrypt-openjdk = { module = "org.conscrypt:conscrypt-openjdk-uber", version.ref = "conscrypt" }

# Logging
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

# Testing (JUnit 5 Jupiter & vintage support)
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junitPlatform" }
junit = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit4 = { module = "junit:junit", version.ref = "junit4" }

# Android Compatibility / Upstream Stubs Support
annotation = { module = "androidx.annotation:annotation", version.ref = "annotation" }
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
desugar_jdk_libs_nio = { module = "com.android.tools:desugar_jdk_libs_nio", version.ref = "desugar_jdk_libs_nio" }
newpipeextractor = { module = "com.github.teamnewpipe:NewPipeExtractor", version.ref = "newpipeextractor" }
anime-db = { module = "com.github.recloudstream:anime-db", version = "1.0.2" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "composePlugin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
android-lint = { id = "com.android.lint", version.ref = "androidGradlePlugin" }
android-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "androidGradlePlugin" }
buildkonfig = { id = "com.codingfeline.buildkonfig", version.ref = "buildkonfigGradlePlugin" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokkaGradlePlugin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotlessPlugin" }

[bundles]
asm = ["asm", "asm-commons", "asm-tree"]
coil = ["coil", "coil-compose", "coil-network-okhttp"]
cryptography = ["cryptography-core", "cryptography-provider-optimal"]
junit = ["junit-jupiter-api", "junit-jupiter-params"]
